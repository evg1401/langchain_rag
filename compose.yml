services:
  qdrant_db:
    image: qdrant/qdrant:latest
    restart: always
    container_name: qdrant_db
    ports:
      - 6333:6333
      # - 6334:6334
    # configs:
    #   - source: qdrant_config
    #     target: /qdrant/config/production.yaml
    volumes:
      - ./qdrant_data:/qdrant/storage
  app_rag:
    build: .
    container_name: app_rag
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    command: uvicorn http_adapter.fastapi:app --host 0.0.0.0 --port 8000
    volumes:
      - ./docs:/app/docs
    depends_on:
      - qdrant_db
    # networks:
    #   - qdrant_qdrant
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - app_rag
    environment:
      PYTHONUNBUFFERED: "1"
      OPENAI_API_BASE_URL: "http://app_rag:8000/v1"
    # networks:
    #   - qdrant_qdrant

# networks:
#   qdrant_qdrant:
#     external: true

volumes:
  open-webui-data: